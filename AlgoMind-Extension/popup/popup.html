<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AlgoMind Fair Play</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <div class="popup-header">
      <div class="logo">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">AlgoMind</span>
      </div>
      <div id="status-badge" class="badge badge--inactive">Inactive</div>
    </div>

    <!-- Challenge Info -->
    <div id="challenge-section" class="challenge-section hidden">
      <div class="info-row">
        <span class="label">Party Code</span>
        <span id="party-code" class="value mono">—</span>
      </div>
      <div class="strike-risk-container">
        <div class="strike-risk-header">
          <span class="label">Strike Limit Used</span>
          <span id="strike-pct" class="strike-pct font-mono">0%</span>
        </div>
        <div class="strike-progress-track">
          <div id="strike-progress-bar" class="strike-progress-bar" style="width: 0%"></div>
        </div>
        <div class="strike-risk-footer">
          <span id="strike-ratio" class="strike-ratio">0 / 3 Strikes</span>
          <span id="strike-status-text" class="strike-status-text">Clean</span>
        </div>
      </div>
    </div>

    <!-- Idle Message -->
    <div id="idle-section" class="idle-section">
      <p class="idle-text">No active challenge.<br/>Start a Friends Code Party on AlgoMind to begin monitoring.</p>
    </div>

    <div class="popup-footer">
      <span class="footer-version">v1.0.1</span>
      <a href="https://algomind-frontend-dvfp.onrender.com" target="_blank" class="footer-link">AlgoMind</a>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
